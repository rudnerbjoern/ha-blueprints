name: Validate

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install validation and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yamllint pytest pytest-cov pyyaml

      - name: Validate YAML
        run: python -m yamllint -c .yamllint .

      - name: Run tests
        run: python -m pytest -v

      - name: Check Markdown trailing whitespace
        run: |
          python - <<'PY'
          from pathlib import Path

          failed = False

          for path in Path(".").rglob("*.md"):
              if ".git" in path.parts:
                  continue

              for number, line in enumerate(
                  path.read_text(encoding="utf-8").splitlines(),
                  1,
              ):
                  if line != line.rstrip():
                      print(f"{path}:{number}: trailing whitespace")
                      failed = True

          raise SystemExit(1 if failed else 0)
          PY
