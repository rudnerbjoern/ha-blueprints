# Example only - replace every entity with entities from your installation.
- type: custom:button-card
  template: vent_room
  entity: sensor.living_room_smart_ventilation
  name: Living Room
  icon: mdi:sofa
  variables:
    accent: "#b86bff"
    temp: sensor.living_room_temperature
    hum: sensor.living_room_humidity
    abs: sensor.living_room_absolute_humidity
    outside_temp: sensor.outdoor_temperature
    outside_hum: sensor.outdoor_humidity
    outside_abs: sensor.outdoor_absolute_humidity
    windows:
      - binary_sensor.living_room_window
    heating: climate.living_room
    valves:
      - sensor.living_room_valve_opening
