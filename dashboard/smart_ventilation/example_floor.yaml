# Example: one floor summary plus its room detail cards.
#
# Replace every example entity with the matching entity from your installation.
# The Floor sensor must use Smart Ventilation Floor API v2.
# Each room sensor must use Smart Ventilation Room API v1.

type: vertical-stack
cards:
  - type: custom:button-card
    template: vent_floor
    entity: sensor.upstairs_smart_ventilation
    name: OG
    label: Obergeschoss
    icon: mdi:home-floor-1
    variables:
      accent: "#5ea9ff"
      opening_windows:
        - binary_sensor.bathroom_window
        - binary_sensor.office_balcony_door
      closing_windows:
        - binary_sensor.bathroom_window
        - binary_sensor.office_balcony_door

  - type: custom:button-card
    template: vent_floor_header
    name: Obergeschoss
    icon: mdi:home-floor-1
    variables:
      accent: "#5ea9ff"
      windows:
        - binary_sensor.bathroom_window
        - binary_sensor.office_balcony_door

  - type: custom:button-card
    template: vent_room
    entity: sensor.bathroom_smart_ventilation
    name: Badezimmer
    icon: mdi:bathtub-outline
    variables:
      accent: "#5ea9ff"
      temp: sensor.bathroom_temperature
      hum: sensor.bathroom_humidity
      abs: sensor.bathroom_absolute_humidity
      outside_temp: sensor.outdoor_temperature
      outside_hum: sensor.outdoor_humidity
      outside_abs: sensor.outdoor_absolute_humidity
      windows:
        - binary_sensor.bathroom_window
      heating: climate.bathroom
      valves:
        - sensor.bathroom_valve_opening

  - type: custom:button-card
    template: vent_room
    entity: sensor.office_smart_ventilation
    name: Büro
    icon: mdi:desk
    variables:
      accent: "#5ea9ff"
      temp: sensor.office_temperature
      hum: sensor.office_humidity
      abs: sensor.office_absolute_humidity
      outside_temp: sensor.outdoor_temperature
      outside_hum: sensor.outdoor_humidity
      outside_abs: sensor.outdoor_absolute_humidity
      windows:
        - binary_sensor.office_balcony_door
      heating: climate.office
      valves:
        - sensor.office_valve_opening
