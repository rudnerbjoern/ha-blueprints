# Smart Ventilation Dashboard - Floor Header
#
# Small reusable header for a floor detail block. It shows the floor name,
# floor icon and the current window count.
#
# Prerequisite:
#   - custom:button-card
#
# Required variables:
#   accent   Accent color for the floor
#   windows  List of window/door binary_sensors displayed for this floor

vent_floor_header:
  variables:
    accent: "#5ea9ff"
    windows: []

  show_icon: true
  show_name: true
  show_label: false
  tap_action:
    action: none

  styles:
    card:
      - height: 56px
      - padding: 0 16px
      - border-radius: 14px
      - border: "[[[ return `1px solid ${variables.accent}66`; ]]]"
      - background: "[[[ return `linear-gradient(90deg, ${variables.accent}16, var(--ha-card-background, var(--card-background-color)) 55%)`; ]]]"
    grid:
      - grid-template-areas: '"i n w"'
      - grid-template-columns: 38px 1fr auto
      - align-items: center
    img_cell:
      - width: 32px
      - height: 32px
    icon:
      - width: 25px
      - color: "[[[ return variables.accent; ]]]"
    name:
      - justify-self: start
      - font-size: 16px
      - font-weight: 700
    custom_fields:
      w:
        - justify-self: end
        - font-size: 13px
        - color: var(--secondary-text-color)

  custom_fields:
    w: >-
      [[[
        const ws = variables.windows || [];
        const open = ws.filter(e => hass.states[e]?.state === 'on').length;
        const txt = open ? `${open} offen · ${ws.length} Fenster` : `${ws.length} Fenster`;
        const icon = open ? 'mdi:window-open-variant' : 'mdi:window-closed-variant';

        return `<span style="display:flex;gap:7px;align-items:center"><ha-icon icon="${icon}" style="width:18px;color:${variables.accent}"></ha-icon>${txt}</span>`;
      ]]]
