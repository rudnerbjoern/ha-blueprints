[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["tests"]
data_file = ".tmp/.coverage"

[tool.coverage.html]
directory = ".tmp/htmlcov"

[tool.coverage.xml]
output = ".tmp/coverage.xml"

[tool.coverage.report]
show_missing = true
skip_empty = true
