# =============================================================================
# Smart Ventilation Control
# Physical opening-state and action layer
# =============================================================================
#
# Data flow:
#   Floor API v2 + physical binary sensors
#   -> contract validation
#   -> derived control state
#   -> user-provided action hooks
#
# This blueprint intentionally creates no helper and no additional sensor.
# =============================================================================
blueprint:
  name: Smart Ventilation Control
  description: >
    Combines one Smart Ventilation Floor sensor with the physical window and
    door states of that floor and runs user-configurable actions when the
    resulting control state changes.

    Control states:

      open
        The floor recommends ventilation and none of the configured ventilation
        openings is currently open.

      close
        The floor recommends keeping windows closed and at least one configured
        close-warning opening is currently open.

      ok
        The physical window state already satisfies the floor recommendation.

      conditional
        The floor recommendation is conditional.

      neutral
        The floor recommendation is neutral.

      unavailable
        The floor sensor, its API version, or one of the configured window
        states is invalid.

    The floor sensor must expose Smart Ventilation Floor API version 2 and use
    one of the states ventilate, conditional, keep_closed, or neutral.

    opening_windows defines all windows and doors that may satisfy a ventilation
    recommendation. closing_windows is optional and, when omitted, falls back to
    opening_windows. If closing_windows is configured explicitly, it must be a
    subset of opening_windows. This allows selected openings to count for
    ventilation without creating close warnings.

    Open and close demand actions are delayed until the demand has remained
    continuously active for the configured stability time and are only executed
    inside the configured active time window. Clear, unavailable, and window
    update actions are processed independently of the active time window.

    Window changes use a separate action hook. This allows a persistent
    notification to be updated live without repeating push notifications or
    voice announcements.

    The blueprint deliberately does not create an additional helper or template
    entity.
  domain: automation
  author: Björn Rudner (@rudnerbjoern)
  # yamllint disable-line rule:line-length
  source_url: https://github.com/rudnerbjoern/ha-blueprints/blob/dev/blueprints/automation/smart_ventilation_control.yaml
  homeassistant:
    min_version: "2024.11.0"

  input:
    recommendation:
      name: Floor recommendation
      icon: mdi:home-floor-0
      input:
        floor_sensor:
          name: Smart Ventilation floor sensor
          description: >
            Floor-level sensor created from the Smart Ventilation Floor
            blueprint. It must expose Smart Ventilation Floor API version 2.
          selector:
            entity:
              filter:
                - domain:
                    - sensor

    windows:
      name: Windows and doors
      icon: mdi:window-open-variant
      input:
        opening_windows:
          name: Ventilation openings
          description: >
            Windows and doors that count as satisfying a ventilation
            recommendation. At least one entity is required.
          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
              multiple: true
              reorder: false

        closing_windows:
          name: Close-warning openings
          description: >
            Optional subset of ventilation openings that should create a close
            demand while open. Leave empty to use all ventilation openings.
          default: []
          selector:
            entity:
              filter:
                - domain:
                    - binary_sensor
              multiple: true
              reorder: false

    timing:
      name: Timing
      icon: mdi:timer-outline
      collapsed: true
      input:
        demand_delay_seconds:
          name: Open/close stability time
          description: >
            An open or close demand must remain continuously active for this
            many seconds before the corresponding action can run.
          default: 120
          selector:
            number:
              min: 0
              max: 1800
              step: 1
              unit_of_measurement: seconds
              mode: box

        window_update_delay_seconds:
          name: Window update settle time
          description: >
            Delay after a window or door state change before evaluating the
            current control state for window update actions.
          default: 1
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: seconds
              mode: box

        active_after:
          name: Open/close actions active after
          description: >
            Earliest time at which open and close demand actions may run.
          default: "07:00:00"
          selector:
            time:

        active_before:
          name: Open/close actions active before
          description: >
            Latest time before which open and close demand actions may run.
          default: "23:00:00"
          selector:
            time:

    actions_section:
      name: Actions
      description: >
        Actions executed for effective control-state events. The variables
        control_state, floor_state, floor_reason, windows_to_open,
        windows_to_close, windows_to_open_names, windows_to_close_names,
        invalid_windows, invalid_closing_windows, open_opening_windows,
        closed_opening_windows, and open_closing_windows are available.
      icon: mdi:play-circle-outline
      input:
        open_actions:
          name: Open demand actions
          description: >
            Runs when an open demand has remained active for the configured
            stability time and the current time is inside the active window.
          default: []
          selector:
            action:

        close_actions:
          name: Close demand actions
          description: >
            Runs when a close demand has remained active for the configured
            stability time and the current time is inside the active window.
          default: []
          selector:
            action:

        clear_actions:
          name: Clear actions
          description: >
            Runs immediately when the derived state becomes ok, conditional,
            or neutral.
          default: []
          selector:
            action:

        unavailable_actions:
          name: Unavailable actions
          description: >
            Runs immediately when the floor recommendation or configured
            windows become invalid or unavailable.
          default: []
          selector:
            action:

        window_update_actions:
          name: Window update actions
          description: >
            Runs after every configured window or door state change, after the
            settle delay. Use this to update a persistent notification without
            repeating push or voice notifications.
          default: []
          selector:
            action:

# =============================================================================
# Trigger-time input bindings
# =============================================================================
#
# Only raw blueprint inputs are bound here. The optional closing-list fallback
# is deliberately calculated in trigger/action scope instead of as a templated
# list in trigger_variables.
# =============================================================================
trigger_variables:
  floor_entity: !input floor_sensor
  opening_entities: !input opening_windows
  configured_closing_entities: !input closing_windows

# =============================================================================
# Triggers
# =============================================================================
#
# open / close:
#   Stable semantic demands using demand_delay_seconds.
#
# ok / conditional / neutral / unavailable:
#   Immediate semantic state transitions.
#
# window_change:
#   Native state trigger for every physical ventilation opening.
#
# active_start:
#   Reconciliation for a demand that existed before the active time window.
# =============================================================================
triggers:
  - trigger: template
    id: open
    value_template: >-
      {% set valid_floor_states = [
        'ventilate',
        'conditional',
        'keep_closed',
        'neutral'
      ] %}
      {% set invalid_closing =
        configured_closing_entities
        | reject('in', opening_entities)
        | list
      %}
      {% set invalid_windows = namespace(count=0) %}
      {% for entity in opening_entities %}
        {% if states(entity) not in ['on', 'off'] %}
          {% set invalid_windows.count = invalid_windows.count + 1 %}
        {% endif %}
      {% endfor %}
      {{
        opening_entities | count > 0
        and states(floor_entity) in valid_floor_states
        and (state_attr(floor_entity, 'api_version') | string) == '2'
        and invalid_closing | count == 0
        and invalid_windows.count == 0
        and states(floor_entity) == 'ventilate'
        and (
          opening_entities
          | select('is_state', 'on')
          | list
          | count
        ) == 0
      }}
    for:
      seconds: !input demand_delay_seconds

  - trigger: template
    id: close
    value_template: >-
      {% set valid_floor_states = [
        'ventilate',
        'conditional',
        'keep_closed',
        'neutral'
      ] %}
      {% set invalid_closing =
        configured_closing_entities
        | reject('in', opening_entities)
        | list
      %}
      {% set invalid_windows = namespace(count=0) %}
      {% for entity in opening_entities %}
        {% if states(entity) not in ['on', 'off'] %}
          {% set invalid_windows.count = invalid_windows.count + 1 %}
        {% endif %}
      {% endfor %}
      {{
        opening_entities | count > 0
        and states(floor_entity) in valid_floor_states
        and (state_attr(floor_entity, 'api_version') | string) == '2'
        and invalid_closing | count == 0
        and invalid_windows.count == 0
        and states(floor_entity) == 'keep_closed'
        and (
          closing_entities
          | select('is_state', 'on')
          | list
          | count
        ) > 0
      }}
    for:
      seconds: !input demand_delay_seconds

  - trigger: template
    id: ok
    value_template: >-
      {% set valid_floor_states = [
        'ventilate',
        'conditional',
        'keep_closed',
        'neutral'
      ] %}
      {% set invalid_closing =
        configured_closing_entities
        | reject('in', opening_entities)
        | list
      %}
      {% set invalid_windows = namespace(count=0) %}
      {% for entity in opening_entities %}
        {% if states(entity) not in ['on', 'off'] %}
          {% set invalid_windows.count = invalid_windows.count + 1 %}
        {% endif %}
      {% endfor %}
      {% set floor_state = states(floor_entity) %}
      {% set opening_count =
        opening_entities
        | select('is_state', 'on')
        | list
        | count
      %}
      {% set closing_count =
        closing_entities
        | select('is_state', 'on')
        | list
        | count
      %}
      {{
        opening_entities | count > 0
        and floor_state in valid_floor_states
        and (state_attr(floor_entity, 'api_version') | string) == '2'
        and invalid_closing | count == 0
        and invalid_windows.count == 0
        and (
          (floor_state == 'ventilate' and opening_count > 0)
          or
          (floor_state == 'keep_closed' and closing_count == 0)
        )
      }}

  - trigger: template
    id: conditional
    value_template: >-
      {% set invalid_closing =
        configured_closing_entities
        | reject('in', opening_entities)
        | list
      %}
      {% set invalid_windows = namespace(count=0) %}
      {% for entity in opening_entities %}
        {% if states(entity) not in ['on', 'off'] %}
          {% set invalid_windows.count = invalid_windows.count + 1 %}
        {% endif %}
      {% endfor %}
      {{
        opening_entities | count > 0
        and states(floor_entity) == 'conditional'
        and (state_attr(floor_entity, 'api_version') | string) == '2'
        and invalid_closing | count == 0
        and invalid_windows.count == 0
      }}

  - trigger: template
    id: neutral
    value_template: >-
      {% set invalid_closing =
        configured_closing_entities
        | reject('in', opening_entities)
        | list
      %}
      {% set invalid_windows = namespace(count=0) %}
      {% for entity in opening_entities %}
        {% if states(entity) not in ['on', 'off'] %}
          {% set invalid_windows.count = invalid_windows.count + 1 %}
        {% endif %}
      {% endfor %}
      {{
        opening_entities | count > 0
        and states(floor_entity) == 'neutral'
        and (state_attr(floor_entity, 'api_version') | string) == '2'
        and invalid_closing | count == 0
        and invalid_windows.count == 0
      }}

  - trigger: template
    id: unavailable
    value_template: >-
      {% set valid_floor_states = [
        'ventilate',
        'conditional',
        'keep_closed',
        'neutral'
      ] %}
      {% set invalid_closing =
        configured_closing_entities
        | reject('in', opening_entities)
        | list
      %}
      {% set invalid_windows = namespace(count=0) %}
      {% for entity in opening_entities %}
        {% if states(entity) not in ['on', 'off'] %}
          {% set invalid_windows.count = invalid_windows.count + 1 %}
        {% endif %}
      {% endfor %}
      {{
        opening_entities | count == 0
        or states(floor_entity) not in valid_floor_states
        or (state_attr(floor_entity, 'api_version') | string) != '2'
        or invalid_closing | count > 0
        or invalid_windows.count > 0
      }}

  - trigger: state
    id: window_change
    entity_id: !input opening_windows

  # Reconcile a demand that was already active before the active time window.
  - trigger: time
    id: active_start
    at: !input active_after

# =============================================================================
# Action pipeline
# =============================================================================
#
# 1. Apply event-specific settle/stability delays.
# 2. Re-read current Floor and physical opening states.
# 3. Validate Floor API and window-list configuration.
# 4. Derive control_state and affected openings.
# 5. Resolve friendly names for action templates.
# 6. Dispatch user-provided action hooks.
# =============================================================================
actions:
  # ---------------------------------------------------------------------------
  # Physical-window settle delay
  #
  # Wait briefly so window_update_actions receives the stable physical state.
  # ---------------------------------------------------------------------------
  - if:
      - condition: trigger
        id: window_change
    then:
      - delay:
          seconds: !input window_update_delay_seconds

  # A demand already present at active_after must remain valid for the configured
  # stability time before a notification/announcement is emitted.
  # ---------------------------------------------------------------------------
  # Active-start reconciliation
  #
  # Wait the full demand stability time again. The current control state is
  # calculated only after this delay, so stale demands cannot leak through.
  # mode: restart cancels this delayed run when a newer relevant event occurs.
  # ---------------------------------------------------------------------------
  - if:
      - condition: trigger
        id: active_start
    then:
      - delay:
          seconds: !input demand_delay_seconds

  # ---------------------------------------------------------------------------
  # Normalize closing_windows and snapshot current physical state
  #
  # Empty closing_windows means: use all opening_windows.
  # ---------------------------------------------------------------------------
  - variables:
      closing_entities: >-
        {{
          configured_closing_entities
          if configured_closing_entities | count > 0
          else opening_entities
        }}
      floor_state: "{{ states(floor_entity) }}"
      floor_reason: "{{ state_attr(floor_entity, 'reason') }}"
      invalid_closing_windows: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in configured_closing_entities %}
          {% if entity not in opening_entities %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
      invalid_windows: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in opening_entities %}
          {% if states(entity) not in ['on', 'off'] %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
      open_opening_windows: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in opening_entities %}
          {% if is_state(entity, 'on') %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
      closed_opening_windows: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in opening_entities %}
          {% if is_state(entity, 'off') %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}
      open_closing_windows: >-
        {% set ns = namespace(entities=[]) %}
        {% for entity in closing_entities %}
          {% if is_state(entity, 'on') %}
            {% set ns.entities = ns.entities + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.entities }}

  # ---------------------------------------------------------------------------
  # Derived control-state contract
  #
  # ventilate + no opening open      -> open
  # ventilate + any opening open     -> ok
  # keep_closed + warning open       -> close
  # keep_closed + warnings closed    -> ok
  # conditional                      -> conditional
  # neutral                          -> neutral
  # invalid contract                 -> unavailable
  # ---------------------------------------------------------------------------
  - variables:
      control_state: >-
        {% set valid_floor_states = [
          'ventilate',
          'conditional',
          'keep_closed',
          'neutral'
        ] %}
        {% if
          opening_entities | count == 0
          or floor_state not in valid_floor_states
          or (state_attr(floor_entity, 'api_version') | string) != '2'
          or invalid_closing_windows | count > 0
          or invalid_windows | count > 0
        %}
          unavailable
        {% elif floor_state == 'ventilate' %}
          {{ 'ok' if open_opening_windows | count > 0 else 'open' }}
        {% elif floor_state == 'keep_closed' %}
          {{ 'close' if open_closing_windows | count > 0 else 'ok' }}
        {% elif floor_state == 'conditional' %}
          conditional
        {% else %}
          neutral
        {% endif %}
      windows_to_open: >-
        {% if control_state == 'open' %}
          {{ closed_opening_windows }}
        {% else %}
          {{ [] }}
        {% endif %}
      windows_to_close: >-
        {% if control_state == 'close' %}
          {{ open_closing_windows }}
        {% else %}
          {{ [] }}
        {% endif %}

  # ---------------------------------------------------------------------------
  # Human-readable affected-opening names
  #
  # friendly_name is preferred; entity_id is the safe fallback.
  # ---------------------------------------------------------------------------
  - variables:
      windows_to_open_names: >-
        {% set ns = namespace(names=[]) %}
        {% for entity in windows_to_open %}
          {% set ns.names = ns.names + [
            state_attr(entity, 'friendly_name') or entity
          ] %}
        {% endfor %}
        {{ ns.names }}
      windows_to_close_names: >-
        {% set ns = namespace(names=[]) %}
        {% for entity in windows_to_close %}
          {% set ns.names = ns.names + [
            state_attr(entity, 'friendly_name') or entity
          ] %}
        {% endfor %}
        {{ ns.names }}

  # ---------------------------------------------------------------------------
  # Action dispatch
  #
  # Regular open/close branches are time-gated.
  # active_start has already waited and revalidated the current demand.
  # clear/unavailable/window_update are intentionally not time-gated.
  # ---------------------------------------------------------------------------
  - choose:
      - conditions:
          - condition: trigger
            id: open
          - condition: time
            after: !input active_after
            before: !input active_before
        sequence: !input open_actions

      - conditions:
          - condition: trigger
            id: close
          - condition: time
            after: !input active_after
            before: !input active_before
        sequence: !input close_actions

      - conditions:
          - condition: trigger
            id: active_start
          - condition: template
            value_template: "{{ control_state == 'open' }}"
        sequence: !input open_actions

      - conditions:
          - condition: trigger
            id: active_start
          - condition: template
            value_template: "{{ control_state == 'close' }}"
        sequence: !input close_actions

      - conditions:
          - condition: trigger
            id:
              - ok
              - conditional
              - neutral
        sequence: !input clear_actions

      - conditions:
          - condition: trigger
            id: unavailable
        sequence: !input unavailable_actions

      - conditions:
          - condition: trigger
            id: window_change
        sequence: !input window_update_actions

mode: restart
max_exceeded: silent
