# =============================================================================
# Smart Ventilation Floor
# Floor-level aggregation engine
# =============================================================================
#
# Architecture:
#   Room API v1 sensors -> validation -> room-state aggregation
#   -> thermal tie-breaker -> Floor API v2 sensor
#
# This layer intentionally does not evaluate physical window/door states and
# does not send notifications. Those responsibilities belong to Control.
#
blueprint:
  name: Smart Ventilation Floor
  description: >
    Aggregates multiple Smart Ventilation room sensors into one floor-level
    ventilation recommendation.

    The blueprint evaluates the recommendations of all configured rooms and
    exposes a single recommendation for the entire floor.

    In addition to the room recommendation states, the blueprint aggregates the
    indoor and outdoor temperature information already exposed by the Smart
    Ventilation room sensors for diagnostics. The physical ventilation decision
    for each individual room remains the responsibility of the Smart
    Ventilation Sensor blueprint.

    Floor states:

      ventilate
        At least one room recommends ventilation and no stronger conflicting
        recommendation exists.

      conditional
        At least one room has a conditional recommendation, or there is a
        direct conflict between rooms recommending ventilate and keep_closed.

      keep_closed
        Every configured room recommends keeping the windows closed.

      neutral
        All configured rooms are neutral, or there is a fresh-air-compatible
        mixture of neutral and keep_closed rooms.

    Aggregation priority:

      1. ventilate + keep_closed
           -> conditional

         A direct conflict between a clear ventilation recommendation and a
         clear keep-closed recommendation must remain visible.

      2. any conditional
           -> conditional

      3. any ventilate
           -> ventilate

      4. all rooms keep_closed
           -> keep_closed

      5. otherwise
           -> neutral

    The blueprint intentionally does not evaluate physical window or door
    states. Window-state evaluation, notifications, announcements, and other
    control logic belong in a separate control layer.

    All configured room sensors must expose Smart Ventilation room API version
    1 and use one of these states:

      ventilate
      conditional
      keep_closed
      neutral

    Required room attributes:

      api_version
      indoor_temperature
      outdoor_temperature
      drying_potential

    If any configured room sensor is unavailable, unknown, exposes an
    unsupported state, has an unsupported API version, or does not provide
    valid numeric temperature and drying-potential attributes, the floor sensor
    becomes unavailable instead of silently ignoring that room.

    The room state trigger intentionally has no from/to filter. Home Assistant
    also fires this trigger for attribute-only changes. Temperature and
    drying-potential attribute changes therefore update the floor immediately
    even when the room recommendation state itself does not change. The
    five-minute time-pattern trigger remains as a defensive reconciliation
    fallback.

    Smart Ventilation Floor API version: 2
  domain: template
  author: Björn Rudner (@rudnerbjoern)
  source_url: https://github.com/rudnerbjoern/ha-blueprints/blob/main/blueprints/template/smart_ventilation_floor.yaml
  homeassistant:
    min_version: "2024.11.0"

  input:
    rooms:
      name: Room sensors
      description: >
        Smart Ventilation room sensors that belong to this floor.
      icon: mdi:home-floor-0
      input:
        room_sensors:
          name: Smart Ventilation room sensors
          description: >
            Room-level sensors created from the Smart Ventilation Sensor
            blueprint.

            Each selected sensor must expose Smart Ventilation room API
            version 1.
          selector:
            entity:
              filter:
                - domain: sensor
              multiple: true
              reorder: false

    thermal:
      name: Thermal diagnostics
      description: >
        Settings used only for floor-level thermal diagnostic attributes.

        These settings do not override the recommendations of the individual
        room sensors.
      icon: mdi:thermometer-lines
      collapsed: true
      input:
        thermal_override_temperature_difference:
          name: Warm-outdoor diagnostic threshold
          description: >
            Minimum average temperature difference in °C between outdoor air
            and the floor's indoor temperature used by the thermal diagnostic
            attributes. This setting no longer overrides room recommendations;
            keep_closed requires unanimous rooms.

            The value is calculated as:

              average outdoor temperature - average indoor temperature

            Positive values mean the outdoor air is warmer.
          default: 1.0
          selector:
            number:
              min: 0.0
              max: 10.0
              step: 0.1
              unit_of_measurement: °C
              mode: box

# =============================================================================
# Triggers
# =============================================================================
#
# The room state trigger intentionally has no from/to filter. In Home Assistant
# that means attribute-only changes also retrigger aggregation. The /5-minute
# trigger is a defensive reconciliation fallback.
#
triggers:
  - trigger: homeassistant
    event: start
    id: homeassistant_start
  # No from/to by design: attribute-only changes must trigger aggregation.
  - trigger: state
    entity_id: !input room_sensors
    id: room_change
  - trigger: time_pattern
    minutes: "/5"
    id: reconcile

# =============================================================================
# Aggregation pipeline
# =============================================================================
#
# Stages:
#   1. Bind inputs
#   2. Validate every Room API v1 sensor fail-closed
#   3. Build room buckets and counts
#   4. Aggregate diagnostic temperature/drying values
#   5. Aggregate thermal diagnostics
#   6. Resolve final floor state and reason
#
actions:
  # ---------------------------------------------------------------------------
  # Stage 1: Bind blueprint inputs.
  # ---------------------------------------------------------------------------
  - variables:
      room_entities: !input room_sensors
      thermal_override_threshold: !input thermal_override_temperature_difference

  # ---------------------------------------------------------------------------
  # Stage 2: Validate every configured room.
  #
  # Required contract:
  #   state in ventilate/conditional/keep_closed/neutral
  #   api_version == 1
  #   indoor_temperature, outdoor_temperature and drying_potential numeric
  #
  # Any invalid room makes the whole floor unavailable; rooms are never silently
  # dropped from aggregation.
  # ---------------------------------------------------------------------------
  - variables:
      invalid_rooms_value: >-
        {% set valid_states = [
          'ventilate',
          'conditional',
          'keep_closed',
          'neutral'
        ] %}
        {% set ns = namespace(rooms=[]) %}
        {% for entity in room_entities %}
          {% set room_state = states(entity) %}
          {% set room_api = state_attr(entity, 'api_version') %}
          {% set indoor = state_attr(entity, 'indoor_temperature') %}
          {% set outdoor = state_attr(entity, 'outdoor_temperature') %}
          {% set drying = state_attr(entity, 'drying_potential') %}
          {% if
            room_state not in valid_states
            or (room_api | string) != '1'
            or not is_number(indoor)
            or not is_number(outdoor)
            or not is_number(drying)
          %}
            {% set ns.rooms = ns.rooms + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.rooms }}

  # ---------------------------------------------------------------------------
  # Stage 3: Build explicit room buckets.
  # Keeping the room entity lists as diagnostics makes floor decisions traceable.
  # ---------------------------------------------------------------------------
  - variables:
      ventilate_rooms_value: >-
        {% set ns = namespace(rooms=[]) %}
        {% for entity in room_entities %}
          {% if states(entity) == 'ventilate' %}
            {% set ns.rooms = ns.rooms + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.rooms }}
      conditional_rooms_value: >-
        {% set ns = namespace(rooms=[]) %}
        {% for entity in room_entities %}
          {% if states(entity) == 'conditional' %}
            {% set ns.rooms = ns.rooms + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.rooms }}
      keep_closed_rooms_value: >-
        {% set ns = namespace(rooms=[]) %}
        {% for entity in room_entities %}
          {% if states(entity) == 'keep_closed' %}
            {% set ns.rooms = ns.rooms + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.rooms }}
      neutral_rooms_value: >-
        {% set ns = namespace(rooms=[]) %}
        {% for entity in room_entities %}
          {% if states(entity) == 'neutral' %}
            {% set ns.rooms = ns.rooms + [entity] %}
          {% endif %}
        {% endfor %}
        {{ ns.rooms }}

  # ---------------------------------------------------------------------------
  # Stage 4: Counts and numeric diagnostic collections.
  # ---------------------------------------------------------------------------
  - variables:
      ventilate_count: "{{ ventilate_rooms_value | count }}"
      conditional_count: "{{ conditional_rooms_value | count }}"
      keep_closed_count: "{{ keep_closed_rooms_value | count }}"
      neutral_count: "{{ neutral_rooms_value | count }}"
      indoor_temperature_values: >-
        {% set ns = namespace(values=[]) %}
        {% for entity in room_entities %}
          {% set value = state_attr(entity, 'indoor_temperature') %}
          {% if is_number(value) %}
            {% set ns.values = ns.values + [value | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}
      outdoor_temperature_values: >-
        {% set ns = namespace(values=[]) %}
        {% for entity in room_entities %}
          {% set value = state_attr(entity, 'outdoor_temperature') %}
          {% if is_number(value) %}
            {% set ns.values = ns.values + [value | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}
      temperature_difference_values: >-
        {% set ns = namespace(values=[]) %}
        {% for entity in room_entities %}
          {% set indoor = state_attr(entity, 'indoor_temperature') %}
          {% set outdoor = state_attr(entity, 'outdoor_temperature') %}
          {% if is_number(indoor) and is_number(outdoor) %}
            {% set ns.values = ns.values
              + [(outdoor | float) - (indoor | float)] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}
      drying_potential_values: >-
        {% set ns = namespace(values=[]) %}
        {% for entity in room_entities %}
          {% set value = state_attr(entity, 'drying_potential') %}
          {% if is_number(value) %}
            {% set ns.values = ns.values + [value | float] %}
          {% endif %}
        {% endfor %}
        {{ ns.values }}

  # ---------------------------------------------------------------------------
  # Stage 5: Aggregate temperature and drying diagnostics.
  # ---------------------------------------------------------------------------
  - variables:
      average_indoor_temperature: >-
        {% if indoor_temperature_values | count > 0 %}
          {{ ((indoor_temperature_values | sum)
            / (indoor_temperature_values | count)) | round(2) }}
        {% else %}
          {{ none }}
        {% endif %}
      minimum_indoor_temperature: >-
        {{ indoor_temperature_values | min | round(2)
           if indoor_temperature_values | count > 0 else none }}
      maximum_indoor_temperature: >-
        {{ indoor_temperature_values | max | round(2)
           if indoor_temperature_values | count > 0 else none }}
      average_outdoor_temperature: >-
        {% if outdoor_temperature_values | count > 0 %}
          {{ ((outdoor_temperature_values | sum)
            / (outdoor_temperature_values | count)) | round(2) }}
        {% else %}
          {{ none }}
        {% endif %}
      minimum_outdoor_temperature: >-
        {{ outdoor_temperature_values | min | round(2)
           if outdoor_temperature_values | count > 0 else none }}
      maximum_outdoor_temperature: >-
        {{ outdoor_temperature_values | max | round(2)
           if outdoor_temperature_values | count > 0 else none }}
      outdoor_temperature_spread: >-
        {% if outdoor_temperature_values | count > 0 %}
          {{ ((outdoor_temperature_values | max)
            - (outdoor_temperature_values | min)) | round(2) }}
        {% else %}
          {{ none }}
        {% endif %}
      average_temperature_difference: >-
        {% if temperature_difference_values | count > 0 %}
          {{ ((temperature_difference_values | sum)
            / (temperature_difference_values | count)) | round(2) }}
        {% else %}
          {{ none }}
        {% endif %}
      minimum_temperature_difference: >-
        {{ temperature_difference_values | min | round(2)
           if temperature_difference_values | count > 0 else none }}
      maximum_temperature_difference: >-
        {{ temperature_difference_values | max | round(2)
           if temperature_difference_values | count > 0 else none }}
      average_drying_potential: >-
        {% if drying_potential_values | count > 0 %}
          {{ ((drying_potential_values | sum)
            / (drying_potential_values | count)) | round(2) }}
        {% else %}
          {{ none }}
        {% endif %}
      maximum_drying_potential: >-
        {{ drying_potential_values | max | round(2)
           if drying_potential_values | count > 0 else none }}

  # ---------------------------------------------------------------------------
  # Stage 6: Thermal diagnostics.
  #
  # The legacy thermal-override condition remains available as a diagnostic,
  # but no longer promotes a mixed floor to keep_closed. That state is now
  # reserved for unanimous room recommendations.
  # ---------------------------------------------------------------------------
  - variables:
      outside_warmer_than_floor: >-
        {{
          is_number(average_temperature_difference)
          and average_temperature_difference | float
            >= thermal_override_threshold | float
        }}
      outside_warmer_than_all_rooms: >-
        {{
          is_number(minimum_temperature_difference)
          and minimum_temperature_difference | float
            >= thermal_override_threshold | float
        }}
      thermal_override_candidate: >-
        {{
          ventilate_count | int == 0
          and conditional_count | int > 0
          and keep_closed_count | int > 0
          and outside_warmer_than_floor | bool
        }}

  # ---------------------------------------------------------------------------
  # Stage 7: Final aggregation priority.
  #
  # 1. ventilate + keep_closed -> conditional
  # 2. any conditional         -> conditional
  # 3. any ventilate           -> ventilate
  # 4. all rooms keep_closed   -> keep_closed
  # 5. otherwise               -> neutral
  # ---------------------------------------------------------------------------
  - variables:
      floor_recommendation: >-
        {% if ventilate_count | int > 0 and keep_closed_count | int > 0 %}
          conditional
        {% elif conditional_count | int > 0 %}
          conditional
        {% elif ventilate_count | int > 0 %}
          ventilate
        {% elif keep_closed_count | int > 0
              and keep_closed_count | int == room_entities | count %}
          keep_closed
        {% else %}
          neutral
        {% endif %}
      floor_reason: >-
        {% if ventilate_count | int > 0 and keep_closed_count | int > 0 %}
          conflicting_room_recommendations
        {% elif conditional_count | int > 0 %}
          conditional_room_present
        {% elif ventilate_count | int > 0 %}
          ventilation_recommended
        {% elif keep_closed_count | int > 0
              and keep_closed_count | int == room_entities | count %}
          all_rooms_keep_closed
        {% elif keep_closed_count | int > 0 %}
          mixed_keep_closed_and_neutral
        {% else %}
          all_rooms_neutral
        {% endif %}

# =============================================================================
# Public Floor Sensor API
# =============================================================================
#
# API version 2. The sensor is unavailable if any configured room violates the
# required Room API contract or required numeric diagnostics are missing.
#
sensor:
  availability: >-
    {{
      room_entities | count > 0
      and invalid_rooms_value | count == 0
    }}
  state: "{{ floor_recommendation }}"
  icon: >-
    {% if floor_recommendation == 'ventilate' %}
      mdi:window-open-variant
    {% elif floor_recommendation == 'conditional' %}
      mdi:weather-windy
    {% elif floor_recommendation == 'keep_closed' %}
      mdi:window-closed-variant
    {% else %}
      mdi:air-filter
    {% endif %}
  attributes:
    api_version: "2"
    room_api_version_required: "1"
    reason: "{{ floor_reason }}"
    room_count: "{{ room_entities | count }}"
    invalid_rooms: "{{ invalid_rooms_value }}"
    thermal_override_temperature_difference: "{{ thermal_override_threshold | float }}"
    ventilate_count: "{{ ventilate_count | int }}"
    conditional_count: "{{ conditional_count | int }}"
    keep_closed_count: "{{ keep_closed_count | int }}"
    neutral_count: "{{ neutral_count | int }}"
    ventilate_rooms: "{{ ventilate_rooms_value }}"
    conditional_rooms: "{{ conditional_rooms_value }}"
    keep_closed_rooms: "{{ keep_closed_rooms_value }}"
    neutral_rooms: "{{ neutral_rooms_value }}"
    average_indoor_temperature: "{{ average_indoor_temperature }}"
    minimum_indoor_temperature: "{{ minimum_indoor_temperature }}"
    maximum_indoor_temperature: "{{ maximum_indoor_temperature }}"
    average_outdoor_temperature: "{{ average_outdoor_temperature }}"
    minimum_outdoor_temperature: "{{ minimum_outdoor_temperature }}"
    maximum_outdoor_temperature: "{{ maximum_outdoor_temperature }}"
    outdoor_temperature_spread: "{{ outdoor_temperature_spread }}"
    average_temperature_difference: "{{ average_temperature_difference }}"
    minimum_temperature_difference: "{{ minimum_temperature_difference }}"
    maximum_temperature_difference: "{{ maximum_temperature_difference }}"
    average_drying_potential: "{{ average_drying_potential }}"
    maximum_drying_potential: "{{ maximum_drying_potential }}"
    outside_warmer_than_floor: "{{ outside_warmer_than_floor | bool }}"
    outside_warmer_than_all_rooms: "{{ outside_warmer_than_all_rooms | bool }}"
    thermal_override_active: false
    thermal_override_candidate: "{{ thermal_override_candidate | bool }}"
