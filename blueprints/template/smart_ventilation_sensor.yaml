# =============================================================================
# Smart Ventilation Sensor
# Room-level recommendation engine
# =============================================================================
#
# Architecture:
#   Sensors -> normalized measurements -> derived physical values
#   -> recommendation decision tree -> diagnostics -> Template Sensor API v1
#
# This blueprint intentionally does not control windows or send notifications.
# Those responsibilities belong to the floor aggregation and control layers.
#
blueprint:
  name: Smart Ventilation Sensor
  description: >
    Creates a room-level ventilation recommendation from indoor/outdoor
    temperature and absolute water-vapor concentration.

    Public states:
      ventilate
        Ventilation is recommended.
      conditional
        Ventilation can be useful, but thermal conditions are unfavorable.
      keep_closed
        Windows should remain closed.
      neutral
        No meaningful ventilation advantage exists.

    The sensor exposes Smart Ventilation Room API version 1. It also exposes
    diagnostics such as drying potential, thermal condition, recommendation
    reason, dry-air protection state, threshold configuration validity, and a
    suggested purge-ventilation duration.

    Required sensor inputs fail closed: when one is unavailable or non-numeric,
    the resulting sensor becomes unavailable.

    Threshold configuration also fails closed. The following relationships must
    be true:
      minimum_drying_potential <= strong_drying_potential
      strong_drying_potential <= very_strong_drying_potential
      warmer_outdoor_threshold <= much_warmer_outdoor_threshold
      minimum_duration <= maximum_duration

    Closing recommendations use an asymmetric comfort band. A small negative
    drying potential remains neutral so fresh-air ventilation can continue;
    keep_closed is only published after its cause remains present for the
    configured confirmation duration (15 minutes by default).

    Optional relative-humidity sensors are intentionally not used directly as
    state-trigger entity IDs because an empty optional blueprint input is not a
    valid entity ID. A one-minute reconciliation trigger therefore keeps
    optional humidity diagnostics and dry-air protection current without making
    the optional selector unsafe.
  domain: template
  author: Björn Rudner (@rudnerbjoern)
  # Keep dev while the blueprint is under active development.
  source_url: https://github.com/rudnerbjoern/ha-blueprints/blob/dev/blueprints/template/smart_ventilation_sensor.yaml
  homeassistant:
    min_version: "2024.11.0"

  input:
    sensors:
      name: Sensors
      description: Climate sensors used to evaluate this room.
      icon: mdi:thermometer-water
      input:
        indoor_temperature:
          name: Indoor temperature
          description: >
            Temperature sensor for the room being evaluated.
            It is used together with the outdoor temperature to calculate the
            thermal disadvantage of ventilation.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

        indoor_vapor_concentration:
          name: Indoor water vapor concentration
          description: Absolute indoor water-vapor concentration in g/m³.
          selector:
            entity:
              filter:
                - domain: sensor

        indoor_relative_humidity:
          name: Indoor relative humidity
          description: >
            Optional. When configured, this value is preferred for indoor
            dry-air protection.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

        outdoor_temperature:
          name: Outdoor temperature
          description: >
            Outdoor temperature sensor used to evaluate the
            thermal cost of ventilation and to select the base purge duration.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: temperature

        outdoor_vapor_concentration:
          name: Outdoor water vapor concentration
          description: Absolute outdoor water-vapor concentration in g/m³.
          selector:
            entity:
              filter:
                - domain: sensor

        outdoor_relative_humidity:
          name: Outdoor relative humidity
          description: >
            Optional diagnostic value. It does not influence the recommendation.
          default: ""
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: humidity

    thresholds:
      name: Evaluation thresholds
      description: >
        Advanced thresholds. Invalid ordering makes the resulting sensor
        unavailable instead of silently producing contradictory classifications.
      icon: mdi:tune
      collapsed: true
      input:
        minimum_drying_potential:
          name: Minimum drying potential
          description: >
            Minimum indoor-minus-outdoor vapor
            concentration difference required before ventilation is considered
            meaningfully useful. Higher values reduce ventilation recommendations.
          default: 0.8
          selector:
            number:
              min: 0.1
              max: 5.0
              step: 0.1
              unit_of_measurement: g/m³
              mode: box

        maximum_acceptable_negative_drying_potential:
          name: Maximum acceptable negative drying potential
          description: >
            Indoor-minus-outdoor vapor concentration disadvantage tolerated
            before closing is considered. The value is entered as a positive
            magnitude. For example, 2.0 keeps values down to -2.0 g/m³ neutral.
            This is intentionally independent from the ventilation threshold.
          default: 2.0
          selector:
            number:
              min: 0.1
              max: 10.0
              step: 0.1
              unit_of_measurement: g/m³
              mode: box

        keep_closed_confirmation_minutes:
          name: Keep-closed confirmation time
          description: >
            Number of uninterrupted minutes a closing condition must remain
            present before keep_closed is published. Other recommendations are
            published immediately, and a confirmed close clears immediately
            when its cause disappears.
          default: 15
          selector:
            number:
              min: 0
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        strong_drying_potential:
          name: Strong drying potential
          description: >
            Threshold at which the outdoor air is
            considered significantly drier than indoor air. It also shortens the
            suggested purge duration.
          default: 2.0
          selector:
            number:
              min: 0.5
              max: 10.0
              step: 0.1
              unit_of_measurement: g/m³
              mode: box

        very_strong_drying_potential:
          name: Very strong drying potential
          description: >
            Threshold for exceptionally dry outdoor
            air. It can justify short conditional ventilation even when outdoor
            air is substantially warmer.
          default: 4.0
          selector:
            number:
              min: 1.0
              max: 15.0
              step: 0.1
              unit_of_measurement: g/m³
              mode: box

        warmer_outdoor_threshold:
          name: Warmer outdoor air threshold
          description: >
            Outdoor-minus-indoor temperature difference
            from which useful drying ventilation becomes conditional because of
            thermal disadvantage.
          default: 1.0
          selector:
            number:
              min: 0.0
              max: 10.0
              step: 0.1
              unit_of_measurement: °C
              mode: box

        much_warmer_outdoor_threshold:
          name: Much warmer outdoor air threshold
          description: >
            Outdoor-minus-indoor temperature
            difference from which windows normally remain closed unless drying
            potential is exceptionally strong.
          default: 3.0
          selector:
            number:
              min: 0.0
              max: 15.0
              step: 0.1
              unit_of_measurement: °C
              mode: box

        minimum_indoor_relative_humidity:
          name: Minimum indoor relative humidity
          description: >
            Below this indoor relative-humidity
            value, further drying ventilation is suppressed when it would remove
            additional moisture.
          default: 35
          selector:
            number:
              min: 20
              max: 60
              step: 1
              unit_of_measurement: "%"
              mode: slider

        minimum_indoor_vapor:
          name: Minimum indoor vapor concentration
          description: >
            Fallback dry-air threshold used only when no indoor RH sensor is
            configured.
          default: 5.5
          selector:
            number:
              min: 2.0
              max: 12.0
              step: 0.1
              unit_of_measurement: g/m³
              mode: box

    ventilation_duration:
      name: Ventilation duration
      description: >
        Base purge-ventilation durations. The final suggestion is adjusted by
        drying potential and thermal disadvantage, then clamped between the
        configured minimum and maximum.
      icon: mdi:timer-outline
      collapsed: true
      input:
        duration_below_zero:
          name: Base duration below 0 °C
          description: >
            Base purge-ventilation duration below 0 °C outdoor temperature.
          default: 4
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider

        duration_zero_to_five:
          name: Base duration from 0 to 5 °C
          description: >
            Base purge duration from 0 °C up to, but not including, 5 °C.
          default: 5
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider

        duration_five_to_ten:
          name: Base duration from 5 to 10 °C
          description: >
            Base purge duration from 5 °C up to, but not including, 10 °C.
          default: 7
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider

        duration_ten_to_fifteen:
          name: Base duration from 10 to 15 °C
          description: >
            Base purge duration from 10 °C up to, but not including, 15 °C.
          default: 10
          selector:
            number:
              min: 1
              max: 30
              step: 1
              unit_of_measurement: min
              mode: slider

        duration_fifteen_to_twenty:
          name: Base duration from 15 to 20 °C
          description: >
            Base purge duration from 15 °C up to, but not including, 20 °C.
          default: 15
          selector:
            number:
              min: 1
              max: 45
              step: 1
              unit_of_measurement: min
              mode: slider

        duration_above_twenty:
          name: Base duration at or above 20 °C
          description: >
            Base purge duration at 20 °C outdoor temperature or warmer.
          default: 20
          selector:
            number:
              min: 1
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

        minimum_duration:
          name: Minimum suggested duration
          description: >
            Lower bound for the calculated whole-minute purge duration.
          default: 2
          selector:
            number:
              min: 1
              max: 15
              step: 1
              unit_of_measurement: min
              mode: slider

        maximum_duration:
          name: Maximum suggested duration
          description: >
            Upper bound for the calculated whole-minute purge duration.
          default: 30
          selector:
            number:
              min: 5
              max: 60
              step: 1
              unit_of_measurement: min
              mode: slider

# =============================================================================
# Triggers
# =============================================================================
#
# Required sensors trigger immediately on state changes.
# Optional relative-humidity inputs cannot safely be referenced directly when
# left empty, therefore a one-minute reconciliation trigger refreshes them.
#
triggers:
  - trigger: homeassistant
    event: start
    id: homeassistant_start
  - trigger: state
    entity_id: !input indoor_temperature
    id: indoor_temperature
  - trigger: state
    entity_id: !input indoor_vapor_concentration
    id: indoor_vapor
  - trigger: state
    entity_id: !input outdoor_temperature
    id: outdoor_temperature
  - trigger: state
    entity_id: !input outdoor_vapor_concentration
    id: outdoor_vapor
  - trigger: time_pattern
    minutes: "/1"
    id: reconcile

# =============================================================================
# Calculation pipeline
# =============================================================================
#
# The variables below are intentionally split into stages:
#   1. Bind blueprint inputs
#   2. Validate sources and configuration
#   3. Normalize measurements
#   4. Derive physical values
#   5. Classify drying/thermal conditions
#   6. Choose candidate recommendation + reason
#   7. Confirm keep-closed candidates
#   8. Estimate whole-minute purge duration
#
actions:
  # ---------------------------------------------------------------------------
  # Stage 1: Bind blueprint inputs to template-safe variables.
  # !input tags are YAML constructs and must not be referenced directly inside
  # Jinja templates.
  # ---------------------------------------------------------------------------
  - variables:
      indoor_temperature_entity: !input indoor_temperature
      indoor_vapor_entity: !input indoor_vapor_concentration
      indoor_humidity_entity: !input indoor_relative_humidity
      outdoor_temperature_entity: !input outdoor_temperature
      outdoor_vapor_entity: !input outdoor_vapor_concentration
      outdoor_humidity_entity: !input outdoor_relative_humidity
      minimum_drying_potential_value: !input minimum_drying_potential
      maximum_acceptable_negative_drying_potential_value: !input maximum_acceptable_negative_drying_potential
      keep_closed_confirmation_minutes_value: !input keep_closed_confirmation_minutes
      strong_drying_potential_value: !input strong_drying_potential
      very_strong_drying_potential_value: !input very_strong_drying_potential
      warmer_outdoor_threshold_value: !input warmer_outdoor_threshold
      much_warmer_outdoor_threshold_value: !input much_warmer_outdoor_threshold
      minimum_indoor_relative_humidity_value: !input minimum_indoor_relative_humidity
      minimum_indoor_vapor_value: !input minimum_indoor_vapor
      duration_below_zero_value: !input duration_below_zero
      duration_zero_to_five_value: !input duration_zero_to_five
      duration_five_to_ten_value: !input duration_five_to_ten
      duration_ten_to_fifteen_value: !input duration_ten_to_fifteen
      duration_fifteen_to_twenty_value: !input duration_fifteen_to_twenty
      duration_above_twenty_value: !input duration_above_twenty
      minimum_duration_value: !input minimum_duration
      maximum_duration_value: !input maximum_duration

  # ---------------------------------------------------------------------------
  # Stage 2: Validate required sensor values and configuration ordering.
  # A contradictory threshold configuration is treated as unavailable instead
  # of producing an ambiguous or silently wrong recommendation.
  # ---------------------------------------------------------------------------
  - variables:
      required_sensors_valid: >-
        {{
          is_number(states(indoor_temperature_entity))
          and is_number(states(indoor_vapor_entity))
          and is_number(states(outdoor_temperature_entity))
          and is_number(states(outdoor_vapor_entity))
        }}
      indoor_humidity_available: >-
        {{
          indoor_humidity_entity | trim != ''
          and is_number(states(indoor_humidity_entity))
        }}
      outdoor_humidity_available: >-
        {{
          outdoor_humidity_entity | trim != ''
          and is_number(states(outdoor_humidity_entity))
        }}
      configuration_errors: >-
        {% set ns = namespace(errors=[]) %}
        {% if minimum_drying_potential_value | float
              > strong_drying_potential_value | float %}
          {% set ns.errors = ns.errors
            + ['minimum_drying_exceeds_strong_drying'] %}
        {% endif %}
        {% if strong_drying_potential_value | float
              > very_strong_drying_potential_value | float %}
          {% set ns.errors = ns.errors
            + ['strong_drying_exceeds_very_strong_drying'] %}
        {% endif %}
        {% if warmer_outdoor_threshold_value | float
              > much_warmer_outdoor_threshold_value | float %}
          {% set ns.errors = ns.errors
            + ['warmer_threshold_exceeds_much_warmer_threshold'] %}
        {% endif %}
        {% if minimum_duration_value | float
              > maximum_duration_value | float %}
          {% set ns.errors = ns.errors
            + ['minimum_duration_exceeds_maximum_duration'] %}
        {% endif %}
        {{ ns.errors }}

  # ---------------------------------------------------------------------------
  # Stage 3: Normalize required numeric measurements.
  # float(0) is safe here because availability independently rejects invalid
  # required source states.
  # ---------------------------------------------------------------------------
  - variables:
      configuration_valid: "{{ configuration_errors | count == 0 }}"
      ti: "{{ states(indoor_temperature_entity) | float(0) }}"
      vi: "{{ states(indoor_vapor_entity) | float(0) }}"
      ta: "{{ states(outdoor_temperature_entity) | float(0) }}"
      va: "{{ states(outdoor_vapor_entity) | float(0) }}"

  # ---------------------------------------------------------------------------
  # Stage 4: Derive the two core physical values.
  #
  # temperature_difference = outdoor - indoor
  #   positive -> outdoor air is warmer
  #
  # drying_potential = indoor vapor - outdoor vapor
  #   positive -> outdoor air is drier and can remove moisture
  # ---------------------------------------------------------------------------
  - variables:
      temperature_difference_value: "{{ (ta | float) - (ti | float) }}"
      drying_potential_value: "{{ (vi | float) - (va | float) }}"
      indoor_relative_humidity_value: >-
        {% if indoor_humidity_available %}
          {{ states(indoor_humidity_entity) | float }}
        {% else %}
          {{ none }}
        {% endif %}
      outdoor_relative_humidity_value: >-
        {% if outdoor_humidity_available %}
          {{ states(outdoor_humidity_entity) | float }}
        {% else %}
          {{ none }}
        {% endif %}

  # ---------------------------------------------------------------------------
  # Stage 5: Classify dry-air protection, drying strength and thermal condition.
  # Indoor RH is preferred when configured; absolute vapor concentration is the
  # fallback protection source.
  # ---------------------------------------------------------------------------
  - variables:
      dry_air_protection: >-
        {% if indoor_humidity_available %}
          {{
            indoor_relative_humidity_value | float
            < minimum_indoor_relative_humidity_value | float
          }}
        {% else %}
          {{ vi | float < minimum_indoor_vapor_value | float }}
        {% endif %}
      drying_potential_level_value: >-
        {% if drying_potential_value | float
              >= very_strong_drying_potential_value | float %}
          very_high
        {% elif drying_potential_value | float
              >= strong_drying_potential_value | float %}
          high
        {% elif drying_potential_value | float
              >= minimum_drying_potential_value | float %}
          moderate
        {% elif drying_potential_value | float
              <= (0 - maximum_acceptable_negative_drying_potential_value | float) %}
          negative
        {% elif drying_potential_value | float < 0 %}
          slightly_negative
        {% else %}
          low
        {% endif %}
      thermal_condition_value: >-
        {% if ta | float < 0 %}
          very_cold
        {% elif ta | float < 5 %}
          cold
        {% elif ta | float < 10 %}
          cool
        {% elif ta | float < 15 %}
          mild
        {% elif temperature_difference_value | float
              >= much_warmer_outdoor_threshold_value | float %}
          much_warmer
        {% elif temperature_difference_value | float
              >= warmer_outdoor_threshold_value | float %}
          warmer
        {% else %}
          comfortable
        {% endif %}

  # ---------------------------------------------------------------------------
  # Stage 6: Candidate recommendation decision tree.
  #
  # Order is significant:
  #   dry-air protection -> wetter outside -> much warmer exceptions
  #   -> warmer conditional -> useful drying -> warm/no benefit -> neutral
  # ---------------------------------------------------------------------------
  - variables:
      candidate_recommendation: >-
        {% if not required_sensors_valid | bool
              or not configuration_valid | bool %}
          unavailable
        {% elif dry_air_protection | bool
              and drying_potential_value | float
              >= minimum_drying_potential_value | float %}
          keep_closed
        {% elif drying_potential_value | float
              <= (0 - maximum_acceptable_negative_drying_potential_value | float) %}
          keep_closed
        {% elif temperature_difference_value | float
              >= much_warmer_outdoor_threshold_value | float
              and drying_potential_value | float
              >= very_strong_drying_potential_value | float %}
          conditional
        {% elif temperature_difference_value | float
              >= much_warmer_outdoor_threshold_value | float %}
          keep_closed
        {% elif temperature_difference_value | float
              >= warmer_outdoor_threshold_value | float
              and drying_potential_value | float
              >= minimum_drying_potential_value | float %}
          conditional
        {% elif drying_potential_value | float
              >= minimum_drying_potential_value | float %}
          ventilate
        {% elif temperature_difference_value | float
              >= warmer_outdoor_threshold_value | float %}
          keep_closed
        {% else %}
          neutral
        {% endif %}
      candidate_recommendation_reason: >-
        {% if not required_sensors_valid | bool %}
          required_sensor_invalid
        {% elif not configuration_valid | bool %}
          configuration_invalid
        {% elif dry_air_protection | bool
              and drying_potential_value | float
              >= minimum_drying_potential_value | float %}
          indoor_air_already_dry
        {% elif drying_potential_value | float
              <= (0 - maximum_acceptable_negative_drying_potential_value | float) %}
          outdoor_air_more_humid
        {% elif temperature_difference_value | float
              >= much_warmer_outdoor_threshold_value | float
              and drying_potential_value | float
              >= very_strong_drying_potential_value | float %}
          strong_drying_benefit_but_much_warmer
        {% elif temperature_difference_value | float
              >= much_warmer_outdoor_threshold_value | float %}
          outdoor_air_much_warmer
        {% elif temperature_difference_value | float
              >= warmer_outdoor_threshold_value | float
              and drying_potential_value | float
              >= minimum_drying_potential_value | float %}
          outdoor_air_drier_but_warmer
        {% elif drying_potential_value | float
              >= very_strong_drying_potential_value | float
              and ta | float < 5 %}
          outdoor_air_much_drier_and_cold
        {% elif drying_potential_value | float
              >= strong_drying_potential_value | float %}
          outdoor_air_significantly_drier
        {% elif drying_potential_value | float
              >= minimum_drying_potential_value | float %}
          outdoor_air_drier
        {% elif temperature_difference_value | float
              >= warmer_outdoor_threshold_value | float %}
          outdoor_air_warmer_without_drying_benefit
        {% else %}
          conditions_similar
        {% endif %}

  # ---------------------------------------------------------------------------
  # Stage 7: Confirm keep-closed candidates without blocking the update action.
  #
  # The sensor's restored attributes carry the start of the pending interval.
  # The one-minute reconciliation trigger advances the timer even if all source
  # values stay unchanged. A non-closing candidate clears it immediately.
  # ---------------------------------------------------------------------------
  - variables:
      previous_candidate_recommendation: >-
        {{ this.attributes.get('candidate_recommendation', '') }}
      previous_keep_closed_pending_since: >-
        {{ this.attributes.get('keep_closed_pending_since', none) }}
      keep_closed_pending_since_value: >-
        {% if candidate_recommendation != 'keep_closed' %}
          {{ none }}
        {% elif this.state == 'keep_closed'
              and previous_keep_closed_pending_since not in [none, '', 'None'] %}
          {{ previous_keep_closed_pending_since }}
        {% elif previous_candidate_recommendation == 'keep_closed'
              and previous_keep_closed_pending_since not in [none, '', 'None'] %}
          {{ previous_keep_closed_pending_since }}
        {% else %}
          {{ now().isoformat() }}
        {% endif %}

  - variables:
      keep_closed_confirmation_elapsed: >-
        {% set pending_timestamp = as_timestamp(
          keep_closed_pending_since_value,
          none
        ) %}
        {{
          candidate_recommendation == 'keep_closed'
          and (
            this.state == 'keep_closed'
            or keep_closed_confirmation_minutes_value | float <= 0
            or (
              pending_timestamp is not none
              and as_timestamp(now()) - pending_timestamp
                >= keep_closed_confirmation_minutes_value | float * 60
            )
          )
        }}
      keep_closed_pending: >-
        {{
          candidate_recommendation == 'keep_closed'
          and not keep_closed_confirmation_elapsed | bool
        }}
      recommendation: >-
        {% if candidate_recommendation == 'keep_closed'
              and keep_closed_confirmation_elapsed | bool %}
          keep_closed
        {% elif candidate_recommendation == 'keep_closed' %}
          neutral
        {% else %}
          {{ candidate_recommendation }}
        {% endif %}
      recommendation_reason: >-
        {% if candidate_recommendation == 'keep_closed'
              and not keep_closed_confirmation_elapsed | bool %}
          keep_closed_pending
        {% else %}
          {{ candidate_recommendation_reason }}
        {% endif %}

  # ---------------------------------------------------------------------------
  # Stage 8: Estimate purge-ventilation duration.
  # The result is intentionally whole minutes only. This is a recommendation,
  # not a second-accurate air-exchange calculation.
  # ---------------------------------------------------------------------------
  - variables:
      base_duration: >-
        {% if ta | float < 0 %}
          {{ duration_below_zero_value }}
        {% elif ta | float < 5 %}
          {{ duration_zero_to_five_value }}
        {% elif ta | float < 10 %}
          {{ duration_five_to_ten_value }}
        {% elif ta | float < 15 %}
          {{ duration_ten_to_fifteen_value }}
        {% elif ta | float < 20 %}
          {{ duration_fifteen_to_twenty_value }}
        {% else %}
          {{ duration_above_twenty_value }}
        {% endif %}
      drying_factor: >-
        {% if drying_potential_value | float
              >= very_strong_drying_potential_value | float %}
          0.70
        {% elif drying_potential_value | float
              >= strong_drying_potential_value | float %}
          0.85
        {% else %}
          1.00
        {% endif %}
      thermal_factor: >-
        {% if temperature_difference_value | float
              >= much_warmer_outdoor_threshold_value | float %}
          0.50
        {% elif temperature_difference_value | float
              >= warmer_outdoor_threshold_value | float %}
          0.65
        {% else %}
          1.00
        {% endif %}

  - variables:
      calculated_duration: >-
        {{
          (
            base_duration | float
            * drying_factor | float
            * thermal_factor | float
          )
          | round(0)
          | int
        }}
      bounded_duration: >-
        {{
          [
            [
              calculated_duration | int,
              minimum_duration_value | int
            ] | max,
            maximum_duration_value | int
          ] | min
        }}

  - variables:
      recommended_duration_minutes_value: >-
        {% if recommendation in ['ventilate', 'conditional'] %}
          {{ bounded_duration | int }}
        {% else %}
          {{ none }}
        {% endif %}

# =============================================================================
# Public Template Sensor API
# =============================================================================
#
# API version 1 exposes the recommendation state plus diagnostic attributes.
# Availability fails closed if required sensors are invalid or the configured
# threshold ordering is contradictory.
#
sensor:
  availability: >-
    {{
      required_sensors_valid | bool
      and configuration_valid | bool
    }}
  state: "{{ recommendation }}"
  icon: >-
    {% if recommendation == 'ventilate' %}
      mdi:window-open-variant
    {% elif recommendation == 'conditional' %}
      mdi:weather-windy
    {% elif recommendation == 'keep_closed' %}
      mdi:window-closed-variant
    {% else %}
      mdi:air-filter
    {% endif %}
  attributes:
    api_version: "1"
    reason: "{{ recommendation_reason }}"
    candidate_recommendation: "{{ candidate_recommendation }}"
    candidate_reason: "{{ candidate_recommendation_reason }}"
    keep_closed_pending: "{{ keep_closed_pending | bool }}"
    keep_closed_pending_since: "{{ keep_closed_pending_since_value }}"
    keep_closed_confirmation_minutes: >-
      {{ keep_closed_confirmation_minutes_value | int }}
    maximum_acceptable_negative_drying_potential: >-
      {{ maximum_acceptable_negative_drying_potential_value | float }}
    configuration_valid: "{{ configuration_valid | bool }}"
    configuration_errors: "{{ configuration_errors }}"
    indoor_temperature: "{{ ti | float | round(1) }}"
    outdoor_temperature: "{{ ta | float | round(1) }}"
    temperature_difference: "{{ temperature_difference_value | float | round(1) }}"
    indoor_vapor_concentration: "{{ vi | float | round(2) }}"
    outdoor_vapor_concentration: "{{ va | float | round(2) }}"
    drying_potential: "{{ drying_potential_value | float | round(2) }}"
    drying_potential_level: "{{ drying_potential_level_value }}"
    indoor_relative_humidity: "{{ indoor_relative_humidity_value }}"
    outdoor_relative_humidity: "{{ outdoor_relative_humidity_value }}"
    dry_air_protection_active: "{{ dry_air_protection | bool }}"
    dry_air_protection_source: >-
      {% if indoor_humidity_available %}
        relative_humidity
      {% else %}
        vapor_concentration
      {% endif %}
    thermal_condition: "{{ thermal_condition_value }}"
    recommended_duration_minutes: "{{ recommended_duration_minutes_value }}"
